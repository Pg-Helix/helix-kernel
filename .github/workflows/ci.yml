name: ci
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  installcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pg: [16, 17, 18]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run pg_regress on PostgreSQL ${{ matrix.pg }}
        run: docker run --rm -v "$PWD":/src:ro postgres:${{ matrix.pg }} /src/ci/run-tests.sh
